<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark ">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-graduation-cap me-2"></i>Student Portal
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-1"></i>Logout
                </a>
            </div>
        </div>
    </nav>

    <!-- Registration Form Section -->
    <section class="registration-section py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-lg border-0">
                        <div class="card-header text-white text-center py-4">
                            <h2 class="mb-0">
                                <i class="fas fa-user-graduate me-2"></i>
                                Student Registration Form
                            </h2>
                            <p class="mb-0 mt-2 opacity-75">Please fill in your details to complete registration</p>
                        </div>
                        
                        <div class="card-body p-5">
                            <form id="registrationForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">
                                            <i class="fas fa-user me-1 "></i>Full Name *
                                        </label>
                                        <input type="text" class="form-control" id="fullName" required>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">
                                            <i class="fas fa-clock me-1 "></i>Class Timings *
                                        </label>
                                        <select class="form-select" id="classTimings" required>
                                            <option value="">Select Class Timing</option>
                                            <option value="Morning (8:00 AM - 12:00 PM)">Morning (8:00 AM - 12:00 PM)</option>
                                            <option value="Afternoon (1:00 PM - 5:00 PM)">Afternoon (1:00 PM - 5:00 PM)</option>
                                            <option value="Evening (6:00 PM - 10:00 PM)">Evening (6:00 PM - 10:00 PM)</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">
                                            <i class="fas fa-building me-1 "></i>Campus *
                                        </label>
                                <select class="form-select" id="campus" required>
                                <option value="">Select Campus</option>
                                <option value="Karachi Campus">Karachi Campus</option>
                                <option value="Lahore Campus">Lahore Campus</option>
                                <option value="Islamabad Campus">Islamabad Campus</option>
                                <option value="Faisalabad Campus">Faisalabad Campus</option>
                                <option value="Peshawar Campus">Peshawar Campus</option>
                                </select>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">
                                            <i class="fas fa-chalkboard-teacher me-1 "></i>Teacher *
                                        </label>
                           <select class="form-select" id="teacher" required>
                                      <option value="">Select Teacher</option>
                                      <option value="Prof. Ahmed Khan">Prof. Ahmed Khan</option>
                                       <option value="Dr. Ayesha Siddiqui">Dr. Ayesha Siddiqui</option>
                                       <option value="Prof. Bilal Qureshi">Prof. Bilal Qureshi</option>
                                       <option value="Dr. Saima Nawaz">Dr. Saima Nawaz</option>
                                       <option value="Prof. Imran Malik">Prof. Imran Malik</option>
                            </select>
                                    </div>
                                </div>
                                
                                <div class="mb-4">
                                    <label class="form-label fw-bold">
                                        <i class="fas fa-book me-1 text-primary"></i>Course *
                                    </label>
                                    <select class="form-select" id="course" required>
                                        <option value="">Select Course</option>
                                        <option value="Computer Science">Computer Science</option>
                                        <option value="Information Technology">Information Technology</option>
                                        <option value="Software Engineering">Software Engineering</option>
                                        <option value="Data Science">Data Science</option>
                                        <option value="Cybersecurity">Cybersecurity</option>
                                        <option value="Web Development">Web Development</option>
                                        <option value="Mobile App Development">Mobile App Development</option>
                                    </select>
                                </div>
                                
                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary btn-lg px-5" id="saveBtn">
                                        <i class="fas fa-save me-2"></i>Save Registration Data
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Info Card -->
                    <div class="card mt-4 border-info">
                        <div class="card-body text-center">
                            <i class="fas fa-info-circle text-info fs-3 mb-2"></i>
                            <h5 class="text-info">Important Information</h5>
                            <p class="mb-0">After saving your registration data, you will be redirected to your dashboard where you can view your profile details.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Loading Overlay -->
    <div class="loading-overlay d-none" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-white">Saving your data...</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="fas fa-info-circle text-primary me-2"></i>
                <strong class="me-auto">Student Portal</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                <!-- Toast message will be inserted here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="registration.js"></script>
</body>
</html>
